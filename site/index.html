<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Moxlite</title>
<style>
  :root { --bg: #f6f5f2; --fg: #1d1b20; --muted: #625b71; --accent: #6750a4; --on-accent: #fff; }
  @media (prefers-color-scheme: dark) { :root { --bg: #141218; --fg: #e6e0e9; --muted: #cac4d0; --accent: #d0bcff; --on-accent: #381e72; } }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 640px; margin: 0 auto; padding: 32px 16px; }
  p { color: var(--muted); }
  a.btn { display: inline-flex; align-items: center; min-height: 44px; padding: 0 18px; border-radius: 22px;
    background: var(--accent); color: var(--on-accent); text-decoration: none; font-weight: 600; margin: 4px 8px 4px 0; }
</style>
</head>
<body>
<main>
  <h1>Moxlite</h1>
  <p>Cliente Android personal para Moxfield, con y sin conexión. Los mazos compartidos desde la app se abren en esta web o directamente en Moxlite.</p>
  <a class="btn" id="apk" href="#">Descargar Moxlite</a>
  <a class="btn" id="repo" href="#">Código</a>
</main>
<script>
  var owner = location.hostname.split(".")[0];
  var repo = location.pathname.split("/").filter(Boolean)[0] || "moxlite";
  var base = "https://github.com/" + owner + "/" + repo;
  document.getElementById("apk").href = base + "/releases/latest/download/moxlite.apk";
  document.getElementById("repo").href = base;
</script>
</body>
</html>
